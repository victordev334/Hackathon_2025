$def with ()
<div class="login-container">
    <h2 class="login-titulo">Iniciar Sesión</h2>
    <form id="formularioLogin">
        <div class="formulario-grupo">
            <label for="username" class="formulario-label">Nombre de Usuario</label>
            <input 
                type="text" 
                id="username" 
                name="username" 
                class="formulario-input" 
                required 
                placeholder="Ingresa tu nombre de usuario"
            >
        </div>

        <div class="formulario-grupo">
            <label for="password" class="formulario-label">Contraseña</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                class="formulario-input" 
                required 
                placeholder="Ingresa tu contraseña"
            >
        </div>

        <button type="submit" class="boton-login">
            Iniciar Sesión
        </button>

        <div class="links-adicionales">
            <a href="#" id="olvidoContrasena">¿Olvidaste tu contraseña?</a>
            <a href="#" id="registrarse">Registrarse</a>
        </div>
    </form>
</div>

<!-- Contenedor de Notificación -->
<div id="notification">
    <span class="notification-icon">✓</span>
    <span class="notification-message"></span>
</div>

<link rel="stylesheet" href="/static/css/login.css">
<script src="/static/js/login.js"></script>
