$def with (error=None, message=None)
<div class="registro-container">
    <h2 class="registro-titulo">Registro de Usuario</h2>
    $if error:
        <p style="color:red;">$error</p>
    $if message:
        <p style="color:green;">$message</p>
    <form id="formularioRegistro" method="POST" action="/Registro">
        <div class="formulario-grupo">
            <label for="username" class="formulario-label">Nombre de Usuario</label>
            <input 
                type="text" 
                id="username" 
                name="username" 
                class="formulario-input" 
                required 
                placeholder="Elige un nombre de usuario"
            >
        </div>

        <div class="formulario-grupo">
            <label for="nombre" class="formulario-label">Nombre</label>
            <input 
                type="text" 
                id="nombre" 
                name="nombre" 
                class="formulario-input" 
                required 
                placeholder="Ingresa tu nombre"
            >
        </div>

        <div class="formulario-grupo">
            <label for="primerApellido" class="formulario-label">Primer Apellido</label>
            <input 
                type="text" 
                id="primerApellido" 
                name="primerApellido" 
                class="formulario-input" 
                required 
                placeholder="Primer apellido"
            >
        </div>

        <div class="formulario-grupo">
            <label for="segundoApellido" class="formulario-label">Segundo Apellido</label>
            <input 
                type="text" 
                id="segundoApellido" 
                name="segundoApellido" 
                class="formulario-input" 
                placeholder="Segundo apellido (opcional)"
            >
        </div>

        <div class="formulario-grupo">
            <label for="correo" class="formulario-label">Correo Electrónico</label>
            <input 
                type="email" 
                id="correo" 
                name="correo" 
                class="formulario-input" 
                required 
                placeholder="ejemplo@correo.com"
            >
        </div>

        <div class="formulario-grupo">
            <label for="password" class="formulario-label">Contraseña</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                class="formulario-input" 
                required 
                placeholder="Elige una contraseña"
            >
        </div>

        <button type="submit" class="boton-registro">
            Registrarse
        </button>
    </form>
</div>

<!-- Contenedor de Notificación -->
<div id="notification">
    <span class="notification-icon">✓</span>
    <span class="notification-message"></span>
</div>


<link rel="stylesheet" href="/static/css/registro.css">
<script src="/static/js/registro.js"></script>
